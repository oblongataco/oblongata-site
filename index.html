<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oblongata</title>

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="alternate icon" href="assets/o-mark.png" />
<meta name="theme-color" content="#1d2e51" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<style>
  :root {
    --beige: #F7F3F0;
    --black: #0E131F;
    --dark-blue: #11203E;
    --blue: #2B4084;
    --accent-blue: #2854E0;
    --mint: #91E8BE;
    --purple: #7242AE;
    --sunshine: #F4C44E;
    --orange: #E47F54;
    --coral: #EA6F6F;
    --light-blue: #87DCE8;
    --moss: #8BAF74;

    --bg: var(--beige);
    --ink: var(--blue);
    --ink-soft: color-mix(in oklab, var(--blue) 70%, var(--beige));
    --ink-faint: color-mix(in oklab, var(--blue) 20%, var(--beige));
    --rule: color-mix(in oklab, var(--blue) 18%, var(--beige));

    --serif: 'Fraunces', 'Times New Roman', serif;
    --mono: 'Space Mono', ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  section[id], div[id] { scroll-margin-top: 100px; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    transition: background 0.4s ease, color 0.4s ease;
  }
  body[data-density="tight"] section.s { padding-top: 56px; padding-bottom: 56px; }
  body[data-density="tight"] section.s.tall { padding-top: 88px; padding-bottom: 88px; }
  body[data-grid-blocks="off"] .hero-accent,
  body[data-grid-blocks="off"] .dark-break-grid,
  body[data-grid-blocks="off"] .dark-break-grid-r { display: none; }

  ::selection { background: var(--ink); color: var(--bg); }

  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

  /* ----- layout shell ----- */
  .shell {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 60px;
    position: relative;
  }

  @media (max-width: 720px) {
    .shell { padding: 0 28px; }
  }

  /* ----- top nav ----- */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    background: color-mix(in oklab, var(--bg) 80%, transparent);
  }
  .nav-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 22px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .nav-mark { display: inline-flex; align-items: center; line-height: 1; text-decoration: none; }
  .nav-mark .nav-word {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-transform: lowercase;
  }
  .nav-links { display: flex; gap: 36px; }
  .nav-links a { position: relative; }
  .nav-links a:hover { text-decoration: none; opacity: 0.6; }

  @media (max-width: 720px) {
    .nav-inner { padding: 14px 28px; gap: 16px; }
    .nav-links { gap: 16px; font-size: 12px; }
  }

  /* ----- hero ----- */
  .hero {
    padding-top: 200px;
    padding-bottom: 140px;
    position: relative;
  }
  .hero-eyebrow {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(22px, 2.4vw, 32px);
    letter-spacing: -0.01em;
    margin: 0 0 80px;
    max-width: 620px;
    line-height: 1.25;
  }
  .hero-eyebrow em {
    font-style: italic;
    font-variation-settings: 'SOFT' 100;
  }

  .wordmark {
    font-family: var(--serif);
    font-weight: 600;
    font-variation-settings: 'opsz' 144, 'SOFT' 30, 'WONK' 1;
    font-size: clamp(60px, 13vw, 240px);
    line-height: 0.85;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin: 0;
    /* the slight italic-on-half trick is gone — keep it like sibling: clean roman for our wordmark, with the 'g' descender doing the work */
  }
  .wordmark .gobl { font-style: normal; }

  .hero-stack {
    display: flex;
    align-items: flex-end;
    flex-wrap: nowrap;
    gap: clamp(32px, 5vw, 80px);
    /* let the wordmark dictate sizing — children inherit em from wordmark via font-size cascade */
    font-size: min(clamp(60px, 13vw, 240px), 16cqi);
    container-type: inline-size;
    line-height: 1;
  }
  .hero-stack .wordmark {
    min-width: 0;
    font-size: 1em;
    line-height: 0.85;
    margin: 0;
  }
  .hero-device {
    flex-shrink: 0;
    width: 0.85em;
    height: 0.85em;
    display: block;
    color: var(--ink);
    /* sit flush with the bottom of the wordmark x-height */
    margin-bottom: 0.06em;
  }

  .hero-meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 36px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ----- section markers (A B C ...) ----- */
  .marker-row {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 28px;
    align-items: start;
  }
  .marker {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--ink);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    background: var(--bg);
    /* echo brand 'oblongata cell' / square */
  }
  .marker-row .body {
    max-width: 640px;
  }
  .marker-row h2 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: none;
    margin: 4px 0 22px;
  }
  .marker-row p { margin: 0 0 18px; }
  .marker-row ul {
    margin: 16px 0 18px;
    padding: 0;
    list-style: none;
  }
  .marker-row ul li {
    position: relative;
    padding-left: 22px;
    margin-bottom: 6px;
  }
  .marker-row ul li::before {
    content: '';
    position: absolute;
    left: 0; top: 11px;
    width: 10px; height: 1.5px;
    background: var(--ink);
  }

  /* ----- section spacing ----- */
  section.s { padding-top: 60px; padding-bottom: 60px; }
  section.s.tall { padding-top: 100px; padding-bottom: 100px; }

  /* ----- big-statement section (page 2 home copy) ----- */
  .statement {
    font-family: var(--serif);
    font-weight: 400;
    font-variation-settings: 'opsz' 144, 'SOFT' 30;
    font-size: clamp(36px, 5.4vw, 84px);
    line-height: 1.04;
    letter-spacing: -0.02em;
    max-width: 1200px;
    margin: 0;
  }
  .statement em {
    font-style: italic;
    color: color-mix(in oklab, var(--ink) 55%, var(--bg));
  }

  /* ----- services 3 columns ----- */
  .services {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 56px;
    margin-top: 80px;
  }
  @media (max-width: 960px) {
    .services { grid-template-columns: 1fr; gap: 56px; }
  }
  .service .num-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .service .num {
    width: 28px; height: 28px;
    border: 1.5px solid var(--ink);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    color: var(--ink);
  }
  .service h3 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .service .strap {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    color: var(--ink);
    margin: 0 0 18px;
    line-height: 1.35;
  }
  .service p { margin: 0 0 18px; }
  .service .typ {
    font-weight: 700;
    margin: 18px 0 8px;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .service ul { margin: 0; padding: 0; list-style: none; }
  .service ul li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 4px;
    font-size: 15px;
    line-height: 1.55;
  }
  .service ul li::before {
    content: '·';
    position: absolute;
    left: 4px; top: 0;
    font-weight: 700;
  }

  /* ----- about / team ----- */
  .about-grid {
    display: grid;
    grid-template-columns: max-content max-content;
    justify-content: center;
    gap: 48px;
    margin-top: 80px;
  }
  @media (max-width: 1100px) {
    .about-grid { gap: 36px; }
  }
  @media (max-width: 820px) {
    .about-grid { grid-template-columns: 1fr; gap: 56px; justify-items: center; }
  }
  .person h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 36px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    line-height: 1.05;
  }
  .person .role {
    font-family: var(--mono);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 24px;
  }
  .person p { margin: 0 0 14px; }
  .person .portrait {
    width: 340px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    margin-bottom: 24px;
    background: var(--rule);
  }
  .person .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(0.05) contrast(1.02);
  }

  /* ----- contact ----- */
  .contact-headline {
    font-family: var(--serif);
    font-weight: 400;
    font-variation-settings: 'opsz' 144, 'SOFT' 30;
    font-size: clamp(28px, 3.6vw, 36px);
    line-height: 1.2;
    letter-spacing: -0.01em;
    max-width: 720px;
    margin: 24px 0 56px;
  }
  .contact-headline em {
    font-style: italic;
    color: color-mix(in oklab, var(--ink) 55%, var(--bg));
  }
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 640px;
  }
  .cf-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 560px) {
    .cf-row { grid-template-columns: 1fr; }
  }
  .cf-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cf-field > span {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .cf-field input,
  .cf-field textarea {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    padding: 8px 0;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 0;
  }
  .cf-field textarea {
    resize: vertical;
    min-height: 100px;
  }
  .cf-field input:focus,
  .cf-field textarea:focus {
    border-bottom-color: var(--ink);
  }
  .cf-submit {
    align-self: flex-start;
    margin-top: 12px;
    background: var(--bg);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    padding: 14px 28px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    transition: background 0.2s, color 0.2s;
  }
  .cf-submit:hover { background: var(--ink); color: var(--bg); }
  .cf-submit:disabled { opacity: 0.5; cursor: wait; }
  .cf-error {
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .cf-error a { text-decoration: underline; }
  .contact-thanks {
    border: 1.5px solid var(--ink);
    padding: 32px 28px;
    max-width: 640px;
  }

  .contact-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 56px;
    margin-top: 64px;
  }
  @media (max-width: 720px) {
    .contact-row { grid-template-columns: 1fr; }
  }
  .cta-card {
    border: 1.5px solid var(--ink);
    padding: 32px 28px;
    background: var(--bg);
    transition: background 0.25s, color 0.25s;
    display: block;
  }
  .cta-card:hover {
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
  }
  .cta-card .label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 18px;
    opacity: 0.7;
  }
  .cta-card .what {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 28px;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .cta-card .arrow {
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ----- footer ----- */
  footer.foot { padding-top: 120px; padding-bottom: 40px; }
  .foot-simple {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 100px;
    font-size: 18px;
    line-height: 1.4;
  }
  .foot-block { color: var(--ink); }
  .foot-cols {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
    margin-bottom: 120px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  @media (max-width: 720px) {
    .foot-cols { grid-template-columns: 1fr 1fr; gap: 28px; }
  }
  .foot-cols .ttl {
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }
  .foot-mark-wrap {
    display: flex;
    align-items: flex-end;
    gap: 32px;
  }
  .foot-mark {
    font-family: var(--serif);
    font-weight: 600;
    font-variation-settings: 'opsz' 144, 'SOFT' 30, 'WONK' 1;
    font-size: clamp(72px, 16vw, 260px);
    line-height: 0.85;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin: 0 0 40px;
    flex: 1;
    min-width: 0;
  }
  .foot-device {
    width: clamp(80px, 12vw, 160px);
    height: clamp(80px, 12vw, 160px);
    flex-shrink: 0;
    margin-bottom: clamp(8px, 1.4vw, 18px);
    align-self: flex-end;
  }
  @media (max-width: 720px) {
    .foot-mark-wrap { gap: 16px; align-items: flex-end; }
    .foot-device { width: 64px; height: 64px; margin-bottom: 6px; }
  }
  .foot-fine {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 1px solid var(--rule);
    padding-top: 20px;
  }

  /* ----- decorative grid blocks (subtle, brand) ----- */
  .grid-strip {
    display: flex;
    gap: 0;
    margin: 0 0 16px;
  }
  .gcell {
    width: 28px; height: 28px;
    border: 1px solid var(--ink);
    background: transparent;
  }
  .gcell.fill { background: var(--ink); }
  .gcell.diag {
    background:
      repeating-linear-gradient(
        45deg,
        var(--ink) 0 1.5px,
        transparent 1.5px 5px
      );
  }
  .gcell.dots {
    background:
      radial-gradient(var(--ink) 0.8px, transparent 1.2px) 0 0/5px 5px;
  }

  /* ----- inline rule used between sections ----- */
  .rule { height: 1px; background: var(--rule); width: 100%; }

  /* ----- the patterned-block hero accent ----- */
  .hero-accent {
    position: absolute;
    right: 60px;
    top: 220px;
    display: grid;
    grid-template-columns: repeat(3, 28px);
    grid-template-rows: repeat(3, 28px);
    gap: 0;
  }
  @media (max-width: 720px) { .hero-accent { display: none; } }

  /* ----- italic-script display flair (for the eccentric 'Flawlessly eccentric' ethos) ----- */
  .ec {
    font-family: var(--serif);
    font-style: italic;
    font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144;
    font-weight: 400;
    color: color-mix(in oklab, var(--ink) 60%, var(--bg));
  }

  /* ----- inline mini-grid used as section spacer ----- */
  .spacer-grid {
    display: grid;
    grid-template-columns: repeat(8, 30px);
    grid-template-rows: 30px;
    margin: 64px 0;
  }
  .spacer-grid .gcell { width: 30px; height: 30px; }

  /* ----- DARK BREAK section ----- */
  .dark-break {
    background: var(--dark-blue);
    color: var(--beige);
    margin: 80px 0;
    padding: 120px 0;
    position: relative;
    overflow: hidden;
  }
  .dark-break .shell { position: relative; }
  .dark-break .statement { color: var(--beige); }
  .dark-break .statement em { color: var(--sunshine); font-style: italic; }
  .dark-break .gcell { border-color: var(--beige); }
  .dark-break .gcell.fill { background: var(--beige); }
  .dark-break .gcell.diag {
    background: repeating-linear-gradient(45deg, var(--beige) 0 1.5px, transparent 1.5px 5px);
  }
  .dark-break .gcell.dots {
    background: radial-gradient(var(--beige) 0.8px, transparent 1.2px) 0 0/5px 5px;
  }
  .dark-break-grid {
    position: absolute;
    left: 60px;
    top: 40px;
    display: grid;
    grid-template-columns: repeat(4, 28px);
    grid-template-rows: repeat(2, 28px);
    opacity: 0.85;
  }
  .dark-break-grid-r {
    position: absolute;
    right: 60px;
    bottom: 40px;
    display: grid;
    grid-template-columns: repeat(6, 28px);
    grid-template-rows: repeat(2, 28px);
    opacity: 0.85;
  }

  /* ----- ICONOGRAPHY tiles ----- */
  .verb-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    margin-top: 64px;
    border-top: 1.5px solid var(--ink);
    border-left: 1.5px solid var(--ink);
  }
  @media (max-width: 960px) { .verb-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 560px) { .verb-grid { grid-template-columns: repeat(2, 1fr); } }
  .verb {
    border-right: 1.5px solid var(--ink);
    border-bottom: 1.5px solid var(--ink);
    aspect-ratio: 1 / 1;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: background 0.25s ease;
    cursor: default;
    position: relative;
  }
  .verb:hover { background: var(--ink); color: var(--bg); }
  .verb:hover .verb-icon { color: var(--bg); }
  .verb-num {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    opacity: 0.6;
  }
  .verb-icon {
    align-self: flex-end;
    width: 32px; height: 32px;
    color: var(--ink);
    transition: color 0.25s;
  }
  .verb-name {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  /* ----- scroll fade ----- */
  .reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.in {
    opacity: 1;
    transform: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ============================================================ */
  /* MOBILE PASS                                                  */
  /* ============================================================ */
  @media (max-width: 720px) {
    /* Nav: smaller wordmark, tighten padding */
    .nav-mark .nav-word { font-size: 18px; }
    .nav-links { gap: 14px; font-size: 12px; }

    /* Hero: pull spacing in, let the wordmark scale even smaller */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "beige",
  "accent": "blue",
  "density": "comfortable",
  "showGridBlocks": true
} /*EDITMODE-END*/;

const paletteMap = {
  beige: { bg: 'var(--beige)', ink: 'var(--blue)' },
  paper: { bg: '#FBF9F7', ink: 'var(--dark-blue)' },
  darkblue: { bg: 'var(--dark-blue)', ink: 'var(--beige)' },
  black: { bg: 'var(--black)', ink: 'var(--beige)' }
};
const accentMap = {
  blue: 'var(--blue)',
  'accent-blue': 'var(--accent-blue)',
  coral: 'var(--coral)',
  sunshine: 'var(--sunshine)',
  mint: 'var(--mint)',
  purple: 'var(--purple)'
};

const applyTweaks = (t) => {
  const root = document.documentElement;
  const p = paletteMap[t.palette] || paletteMap.beige;
  root.style.setProperty('--bg', p.bg);
  root.style.setProperty('--ink', t.palette === 'darkblue' || t.palette === 'black' ? 'var(--beige)' : accentMap[t.accent] || p.ink);
  // soft + rule recompute via color-mix already use --ink/--bg, but re-set them explicitly for stronger contrast on dark
  if (t.palette === 'darkblue' || t.palette === 'black') {
    root.style.setProperty('--ink-soft', 'color-mix(in oklab, var(--beige) 70%, ' + p.bg + ')');
    root.style.setProperty('--rule', 'color-mix(in oklab, var(--beige) 22%, ' + p.bg + ')');
  } else {
    root.style.setProperty('--ink-soft', 'color-mix(in oklab, ' + (accentMap[t.accent] || p.ink) + ' 70%, ' + p.bg + ')');
    root.style.setProperty('--rule', 'color-mix(in oklab, ' + (accentMap[t.accent] || p.ink) + ' 18%, ' + p.bg + ')');
  }
  document.body.dataset.density = t.density;
  document.body.dataset.gridBlocks = t.showGridBlocks ? 'on' : 'off';
};

const Tweaks = () => {
  const { TweaksPanel, useTweaks, TweakSection, TweakSelect, TweakRadio, TweakToggle } = window;
  if (!TweaksPanel || !useTweaks) return null;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {applyTweaks(tweaks);}, [tweaks]);
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Palette" />
      <TweakRadio label="Background" value={tweaks.palette} onChange={(v) => setTweak('palette', v)} options={[
      { value: 'beige', label: 'Beige' },
      { value: 'paper', label: 'Paper' },
      { value: 'darkblue', label: 'Dark' },
      { value: 'black', label: 'Black' }]
      } />
      <TweakSelect label="Ink / accent" value={tweaks.accent} onChange={(v) => setTweak('accent', v)} options={[
      { value: 'blue', label: 'Oblongata blue' },
      { value: 'accent-blue', label: 'Accent blue' },
      { value: 'coral', label: 'Coral' },
      { value: 'sunshine', label: 'Sunshine' },
      { value: 'mint', label: 'Mint' },
      { value: 'purple', label: 'Purple' }]
      } />
      <TweakSection label="Layout" />
      <TweakRadio label="Density" value={tweaks.density} onChange={(v) => setTweak('density', v)} options={[
      { value: 'comfortable', label: 'Comfy' },
      { value: 'tight', label: 'Tight' }]
      } />
      <TweakToggle label="Grid blocks" value={tweaks.showGridBlocks} onChange={(v) => setTweak('showGridBlocks', v)} />
    </TweaksPanel>);

};

/* ============================================================ */
/* SCROLL REVEAL                                                */
/* ============================================================ */

const useReveal = () => {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {if (e.isIntersecting) {e.target.classList.add('in');io.unobserve(e.target);}});
    }, { threshold: 0.12 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
};

const App = () => {
  useReveal();
  React.useEffect(() => {applyTweaks(TWEAK_DEFAULTS);}, []);
  return (
    <>
      <Hero />
      <div className="reveal"><Who /></div>
      <div className="reveal"><Services /></div>
      <div className="reveal"><About /></div>
      <div className="reveal"><Clients /></div>
      <div className="reveal"><Contact /></div>
      <Footer />
      <Tweaks />
    </>);

};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
